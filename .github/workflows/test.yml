name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04   # 固定版本，避免 ubuntu-latest 日後改指新系統而突然出問題
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # index.html 必須是 template／VERSION／SheetJS 建置出來的最新結果
      - run: npm run check:build
      - run: npm test
