<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel RevDiff Offline</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232457c5'/%3E%3Crect x='6' y='7' width='20' height='4.5' rx='2' fill='%234ade80'/%3E%3Crect x='6' y='13.75' width='20' height='4.5' rx='2' fill='%23facc15'/%3E%3Crect x='6' y='20.5' width='20' height='4.5' rx='2' fill='%23f87171'/%3E%3C/svg%3E">
<script>(function(){var th='dark';try{var v=localStorage.getItem('revdiff-theme');if(v==='light'||v==='dark')th=v;}catch(e){}document.documentElement.setAttribute('data-theme',th);})();</script>
<style>
/*__INCLUDE:styles.css__*/
</style>
</head>
<body>
<header><h1>Excel RevDiff Offline</h1><span class="ver" title="Version">v__APP_VERSION__</span><span class="sub" data-i18n="subtitle"></span><span class="sp"></span>
  <button class="langbtn" id="langBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.7 3.9 5.9 3.9 9.5s-1.3 6.8-3.9 9.5c-2.6-2.7-3.9-5.9-3.9-9.5S9.4 5.2 12 2.5z"/></svg><span id="langCode"></span></button>
  <button class="langbtn iconbtn" id="themeBtn" type="button"><svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg><svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></header>
<main>
  <section class="card">
    <h2><span class="step">1</span><span data-i18n="s1"></span></h2>
    <div class="files" id="files"></div>
  </section>

  <section class="card" id="cfgCard" hidden>
    <h2><span class="step">2</span><span data-i18n="s2"></span></h2>
    <div class="legend">
      <span data-i18n="legKey"></span>
      <span data-i18n="legCmp"></span>
      <span data-i18n="legQty"></span>
    </div>
    <div class="cfgbar">
      <input type="search" id="colFilter" data-i18n-ph="phCol">
      <button class="btn" id="btnSuggest" data-i18n="btnSuggest" data-i18n-title="titSuggest"></button>
      <button class="btn" id="btnReset" data-i18n="btnReset"></button>
    </div>
    <div class="cfgwrap" id="cfgTable"></div>
    <div class="applybar">
      <div id="cfgStatus" class="cfgstatus"></div>
      <span class="pend" id="pend"></span>
      <button class="primary" id="btnApply" data-i18n="btnApply"></button>
    </div>
    <p class="hint" data-i18n="normHint"></p>
  </section>

  <div id="msg"></div>

  <section class="card" id="sumCard" hidden>
    <h2><span class="step">3</span><span data-i18n="s3"></span></h2>
    <div class="stats" id="stats"></div>
    <div class="colstat" id="colStat"></div>
  </section>

  <div id="warns"></div>

  <section class="card" id="resCard" hidden>
    <h2><span class="step">4</span><span data-i18n="s4"></span></h2>
    <div class="opts" style="margin:0 0 10px">
      <label><input type="checkbox" id="optHideEmpty" checked> <span data-i18n="optHideEmpty"></span></label>
      <label><input type="checkbox" id="optOnlyDiff"> <span data-i18n="optOnlyDiff"></span></label>
    </div>
    <div class="toolbar" id="dtool" hidden>
      <b data-i18n="dTitle"></b>
      <select id="dcol"></select>
      <div class="chips" id="dmodes"></div>
      <span class="meta" id="dsum"></span>
    </div>
    <div class="toolbar">
      <div class="chips" id="fchips"></div>
      <input type="search" id="q" data-i18n-ph="phQ">
      <span class="meta" id="cnt"></span>
      <span class="sp"></span>
      <label class="opts" style="margin:0"><span style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="expFiltered"> <span data-i18n="expFiltered"></span></span></label>
      <button class="primary" id="btnExport" data-i18n="btnExport"></button>
    </div>
    <div class="tw" id="tw"></div>
  </section>
</main>

<div id="busy" hidden><div class="box"><div class="t" id="busyT"></div><div class="s" data-i18n="busyNote"></div><div class="s" id="busyE"></div><div class="bar"><i></i></div></div></div>
<script type="text/plain" id="sheetjs-src">/*__SHEETJS__*/</script>
<script>
/*__INCLUDE:js/i18n.js__*/
/*__INCLUDE:js/normalize.js__*/
/*__INCLUDE:js/state.js__*/
/*__INCLUDE:js/load.js__*/
/*__INCLUDE:js/settings.js__*/
/*__INCLUDE:js/compare.js__*/
/*__INCLUDE:js/worker.js__*/
/*__INCLUDE:js/view.js__*/
/*__INCLUDE:js/export.js__*/
/*__INCLUDE:js/main.js__*/
</script>
</body>
</html>
