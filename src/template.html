<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel RevDiff Offline</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--text:#1d2433;--muted:#667085;--line:#d9dee7;--accent:#2457c5;--accent-soft:#e6edfb;
  --add:#d7f2dd;--add-t:#17642b;--del:#fbd9d9;--del-t:#a12121;--mod:#fff1b3;--mod-t:#7a5a00;--same-t:#475467;
  --old:#b42318;--on-accent:#fff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12161d;--panel:#1b212b;--text:#e6e9ef;--muted:#98a2b3;--line:#323b4a;--accent:#7aa2f7;--accent-soft:#25324d;
  --add:#1c3d27;--add-t:#8fe3a6;--del:#4a2022;--del-t:#ff9c9c;--mod:#5a4a10;--mod-t:#ffe38a;--same-t:#b5bdcb;--old:#ff9c8f;--on-accent:#101521}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:18px}
header span{color:var(--muted);font-size:12px}
main{padding:16px 20px;max-width:1800px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card{border-top:3px solid var(--accent)}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:19px;font-weight:700}
.card h2 .step{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:16px;font-weight:700}
.files{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.files{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;cursor:pointer;color:var(--muted);display:block}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--text)}
.drop input{display:none}
.finfo{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
.finfo label{display:flex;gap:6px;align-items:center}
select,input[type=number],input[type=search]{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
input[type=number]{width:70px}
.meta{color:var(--muted);font-size:12px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;font-size:13px;background:var(--panel)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
details{margin-top:10px}
summary{cursor:pointer;color:var(--accent)}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 12px;max-height:260px;overflow:auto;margin-top:8px;font-size:13px}
.colgrid .r{display:flex;align-items:center;gap:8px;border-bottom:1px dotted var(--line);padding:2px 0}
.colgrid .r b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{position:relative;min-height:92px;border-radius:8px;padding:10px 14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.stat .lb{position:absolute;top:8px;left:12px;font-size:13px}
.stat .n{font-size:30px;font-weight:700;line-height:1.1}
.stat.add{background:var(--add);color:var(--add-t)}.stat.del{background:var(--del);color:var(--del-t)}
.stat.mod{background:var(--mod);color:var(--mod-t)}.stat.same{color:var(--same-t)}
.colstat{margin-top:10px;font-size:13px;color:var(--muted)}
.colstat b{color:var(--text)}
.warn{border:1px solid #e0a800;background:rgba(255,193,7,.12);border-radius:8px;padding:10px 12px}
.warn.err{border-color:#d92d20;background:rgba(217,45,32,.1)}
.warn h3{margin:0 0 4px;font-size:14px}
.warn ul{margin:4px 0 0;padding-left:20px;max-height:220px;overflow:auto;font-size:13px}
.warn code{background:rgba(0,0,0,.08);padding:0 4px;border-radius:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{min-width:240px;flex:0 1 320px}
.fchip{border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;background:var(--panel);font-size:13px;color:var(--text)}
.fchip.on.add{background:var(--add);color:var(--add-t);border-color:var(--add-t)}
.fchip.on.del{background:var(--del);color:var(--del-t);border-color:var(--del-t)}
.fchip.on.mod{background:var(--mod);color:var(--mod-t);border-color:var(--mod-t)}
.fchip.on.same,.fchip.on.all{background:var(--accent-soft);border-color:var(--accent)}
.fchip:not(.on){opacity:.55}
button.primary{background:var(--accent);color:var(--on-accent);font-weight:600;border:0;border-radius:6px;padding:6px 14px;font:inherit;cursor:pointer}
button.primary:disabled{opacity:.4;cursor:not-allowed}
.sp{flex:1}
.tw{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;vertical-align:top;text-align:left}
th{position:sticky;top:0;background:var(--panel);z-index:2;font-weight:600;border-bottom:2px solid var(--line)}
th.key{background:var(--accent-soft)}
td.cat,th.cat{position:sticky;left:0;z-index:1;background:var(--panel);font-weight:600}
th.cat{z-index:3}
tr.add td{background:var(--add);color:var(--add-t)}
tr.del td{background:var(--del);color:var(--del-t)}
tr.same td{color:var(--same-t)}
tr.add td.cat,tr.del td.cat,tr.mod td.cat{}
tr.mod td.cat{background:var(--mod);color:var(--mod-t)}
td.chg{background:var(--mod)!important;color:var(--mod-t)!important}
td.chg .o{color:var(--old);text-decoration:line-through;opacity:.9}
td.chg .arrow{margin:0 4px;opacity:.7}
td.chg .nv{font-weight:700}
td.chg .dl{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;background:rgba(0,0,0,.12);font-weight:700}
.empty{font-style:italic;opacity:.7}
.rn{color:var(--muted);text-align:right}
.more{text-align:center;padding:10px}
#busy{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
#busy[hidden]{display:none}
#busy .box{background:var(--panel);color:var(--text);border-radius:12px;padding:22px 34px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#busy .t{font-size:17px;font-weight:700}
#busy .s{color:var(--muted);font-size:12px;margin-top:6px}
#busy .bar{height:4px;margin-top:14px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
#busy .bar i{position:absolute;inset:0 auto 0 0;width:35%;background:var(--accent);animation:slide 1.1s ease-in-out infinite alternate}
@keyframes slide{to{left:65%}}
.legend{display:flex;flex-wrap:wrap;gap:4px 22px;color:var(--muted);font-size:12.5px;margin-bottom:10px}
.legend b{color:var(--text)}
.cfgbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.cfgbar input[type=search]{width:220px}
.btn{border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer;background:var(--panel);color:var(--text);font:inherit;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.cfgwrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.cfgt{width:100%;border-collapse:separate;border-spacing:0}
.cfgt th{position:sticky;top:0;background:var(--panel);z-index:2;padding:6px 10px;border-bottom:2px solid var(--line);text-align:center;white-space:nowrap}
.cfgt th.l,.cfgt td.l{text-align:left}
.cfgt td{padding:4px 10px;border-bottom:1px solid var(--line);text-align:center}
.cfgt tbody tr:hover td{background:rgba(127,127,127,.08)}
.cfgt tr.iskey td{background:var(--accent-soft)}
.cfgt td.nm{font-weight:600;white-space:nowrap}
.cfgt td.smp{color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.cfgt input[type=checkbox]{width:16px;height:16px;cursor:pointer;vertical-align:middle}
.cfgt input:disabled{cursor:not-allowed;opacity:.35}
.cfgt .tag{font-weight:400;font-size:11px;color:var(--mod-t);background:var(--mod);border-radius:4px;padding:0 5px;margin-left:6px}
.mini{display:block;font-weight:400;font-size:11px;margin-top:2px}
.mini a{cursor:pointer;color:var(--accent);margin:0 4px;text-decoration:underline}
.applybar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cfgstatus{flex:1;min-width:240px;font-size:13px}
.pend{font-size:13px;font-weight:600;color:var(--mod-t);background:var(--mod);border-radius:6px;padding:2px 10px}
.pend:empty{display:none}
#warns{display:flex;flex-direction:column;gap:6px}
details.warn{padding:8px 12px}
details.warn>summary{cursor:pointer;font-weight:700;color:inherit}
details.warn>div,details.warn>ul{margin-top:8px}
.ph{color:var(--muted);text-align:center;padding:30px}
</style>
</head>
<body>
<header><h1>Excel RevDiff Offline</h1><span>比對兩份格式相同的 Excel・完全離線，資料僅在本機瀏覽器處理，不會上傳</span></header>
<main>
  <section class="card">
    <h2><span class="step">1</span>選擇檔案</h2>
    <div class="files" id="files"></div>
  </section>

  <section class="card" id="cfgCard" hidden>
    <h2><span class="step">2</span>比對設定</h2>
    <div class="legend">
      <span><b>Key</b>：用來配對新舊兩列的欄位組合（可多選）</span>
      <span><b>比對</b>：要檢查是否被修改的欄位（不勾＝忽略該欄差異）</span>
      <span><b>數量</b>：該欄變動時顯示差值（如 12 → 15，+3）</span>
    </div>
    <div class="cfgbar">
      <input type="search" id="colFilter" placeholder="搜尋欄位名稱">
      <button class="btn" id="btnSuggest" title="依欄位名稱或資料內容，幫你勾選可能的 Key">建議 Key</button>
      <button class="btn" id="btnReset">全部清除</button>
    </div>
    <div class="cfgwrap" id="cfgTable"></div>
    <div class="applybar">
      <div id="cfgStatus" class="cfgstatus"></div>
      <span class="pend" id="pend"></span>
      <button class="primary" id="btnApply">套用並開始比對</button>
    </div>
    <p class="hint">比對前正規化：去除前後空白、全形轉半形、忽略大小寫、數字 10 與 10.0 視為相同（有前置 0 的代碼如 007 不會被當成數字）。</p>
  </section>

  <div id="msg"></div>

  <section class="card" id="sumCard" hidden>
    <h2><span class="step">3</span>比對摘要</h2>
    <div class="stats" id="stats"></div>
    <div class="colstat" id="colStat"></div>
  </section>

  <div id="warns"></div>

  <section class="card" id="resCard" hidden>
    <h2><span class="step">4</span>比對結果</h2>
    <div class="opts" style="margin:0 0 10px">
      <label><input type="checkbox" id="optHideEmpty" checked> 隱藏全空欄位</label>
      <label><input type="checkbox" id="optOnlyDiff"> 只顯示 Key 與有差異的欄位</label>
    </div>
    <div class="toolbar">
      <div class="chips" id="fchips"></div>
      <input type="search" id="q" placeholder="搜尋任何欄位（可用空白分隔多個關鍵字）">
      <span class="meta" id="cnt"></span>
      <span class="sp"></span>
      <label class="opts" style="margin:0"><span style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="expFiltered"> 僅匯出目前篩選結果</span></label>
      <button class="primary" id="btnExport">匯出 .xlsx</button>
    </div>
    <div class="tw" id="tw"></div>
  </section>
</main>

<div id="busy" hidden><div class="box"><div class="t" id="busyT">處理中…</div><div class="s">檔案較大時需要幾秒到數十秒，請稍候，畫面暫時沒反應是正常的</div><div class="bar"><i></i></div></div></div>
<script>/*__SHEETJS__*/</script>
<script>
'use strict';
/* ================= 工具函式 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NUM_RE = /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/;

function cellStr(v){
  if (v == null) return '';
  if (v instanceof Date){
    if (isNaN(v)) return '';
    const p = n => String(n).padStart(2,'0');
    const d = v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());
    const t = p(v.getHours())+':'+p(v.getMinutes());
    return (v.getHours()||v.getMinutes()) ? d+' '+t : d;
  }
  return String(v);
}
/* 文字正規化：NFKC(全形→半形)、去前後空白、合併連續空白、轉小寫 */
function normText(v){
  return cellStr(v).normalize('NFKC').replace(/[ 　]/g,' ').trim().replace(/\s+/g,' ').toLowerCase();
}
/* 嘗試把正規化後文字視為數字；有前置 0 的代碼（007）不視為數字 */
function numOf(s){
  let t = s;
  if (/^[+-]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g,'');
  if (!NUM_RE.test(t)) return null;
  if (/^[+-]?0\d/.test(t)) return null;
  const n = Number(t);
  return isFinite(n) ? n : null;
}
function norm(v){
  const s = normText(v), n = numOf(s);
  return n === null ? s : String(n === 0 ? 0 : n);
}
/* 差值用：寬鬆解析數字（含前置 0） */
function parseNum(v){
  let s = normText(v).replace(/,/g,'');
  if (s === '' || !NUM_RE.test(s)) return null;
  const n = Number(s); return isFinite(n) ? n : null;
}
function fmtDelta(d){
  d = Math.round(d*1e9)/1e9;
  return (d > 0 ? '+' : '') + String(d);
}

/* ================= 狀態 ================= */
const S = {
  A:{id:'A', label:'Rev A（舊版）', wb:null, name:'', sheet:'', hr:1, aoa:null, off:0, headers:[], rows:null},
  B:{id:'B', label:'Rev B（新版）', wb:null, name:'', sheet:'', hr:1, aoa:null, off:0, headers:[], rows:null},
};
const draft = { key:new Set(), cmp:new Set(), qty:new Set() };   // 使用者正在編輯的設定
let applied = null;                                            // 已套用（比對結果所依據）的設定
let colFilter = '';
let COLS = [];          // 兩檔欄位聯集
let R = null;           // 最近一次比對結果
let shown = [];         // 目前篩選後的 entries
let visCols = [];       // 目前顯示的欄位
let statusOn = new Set(['add','del','mod','same']);
let pageSize = 500;

/* ================= 處理中提示 ================= */
/* 先顯示提示並讓瀏覽器畫出來，再執行耗時工作；結束後一定會關閉 */
function showBusy(msg){ $('#busyT').textContent = msg || '處理中…'; $('#busy').hidden = false; }
function hideBusy(){ $('#busy').hidden = true; }
const nextPaint = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
async function withBusy(msg, fn){
  showBusy(msg);
  await nextPaint();
  try{ return fn(); } finally{ hideBusy(); }
}

/* ================= 讀檔 ================= */
function buildSlotUI(slot){
  const el = document.createElement('div');
  el.innerHTML = `
    <label class="drop" id="drop${slot.id}">
      <input type="file" accept=".xlsx,.xlsm,.xls" id="file${slot.id}">
      <b>${slot.label}</b><br>點擊選擇檔案，或把 .xlsx 拖曳到這裡
    </label>
    <div class="finfo" id="info${slot.id}" hidden>
      <span id="fname${slot.id}" style="font-weight:600"></span>
      <label>工作表 <select id="sheet${slot.id}"></select></label>
      <label>標題列在第 <input type="number" min="1" id="hr${slot.id}"> 列</label>
    </div>
    <div class="meta" id="meta${slot.id}"></div>`;
  $('#files').appendChild(el);
  const inp = $('#file'+slot.id), drop = $('#drop'+slot.id);
  inp.addEventListener('change', () => inp.files[0] && loadFile(slot, inp.files[0]));
  ['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.add('over');}));
  ['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.remove('over');}));
  drop.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) loadFile(slot, f); });
  $('#sheet'+slot.id).addEventListener('change', e => { slot.sheet = e.target.value; slot.aoa = null; withBusy('讀取工作表中…', () => { parseSlot(slot, true); refresh(); }); });
  $('#hr'+slot.id).addEventListener('change', e => { slot.hr = Math.max(1, parseInt(e.target.value)||1); withBusy('讀取資料中…', () => { parseSlot(slot, false); refresh(); }); });
}
function showMsg(html, err){
  $('#msg').innerHTML = html ? `<div class="warn ${err?'err':''}">${html}</div>` : '';
}
function loadFile(slot, file){
  const rd = new FileReader();
  showBusy(`讀取 ${file.name} 中…`);
  rd.onerror = () => { hideBusy(); showMsg(`無法讀取檔案 <code>${esc(file.name)}</code>`, true); };
  rd.onload = async () => {
    await nextPaint();
    try{
      const wb = XLSX.read(new Uint8Array(rd.result), {type:'array', cellDates:true});
      if (!wb.SheetNames.length) throw new Error('檔案內沒有工作表');
      slot.wb = wb; slot.name = file.name;
      const other = slot.id === 'A' ? S.B : S.A;
      slot.sheet = (other.wb && wb.SheetNames.includes(other.sheet)) ? other.sheet : wb.SheetNames[0];
      $('#sheet'+slot.id).innerHTML = wb.SheetNames.map(n => `<option>${esc(n)}</option>`).join('');
      $('#sheet'+slot.id).value = slot.sheet;
      $('#fname'+slot.id).textContent = file.name;
      $('#info'+slot.id).hidden = false;
      showMsg('');
      parseSlot(slot, true);
      refresh();
    }catch(e){
      showMsg(`讀取 <code>${esc(file.name)}</code> 失敗：${esc(e.message||e)}（請確認是有效的 .xlsx，且未加密）`, true);
    }finally{ hideBusy(); }
  };
  rd.readAsArrayBuffer(file);
}
function detectHeader(aoa){
  const lim = Math.min(aoa.length, 30);
  const cnt = i => aoa[i].filter(c => cellStr(c).trim() !== '').length;
  let mx = 0;
  for (let i=0;i<lim;i++) mx = Math.max(mx, cnt(i));
  for (let i=0;i<lim;i++) if (mx && cnt(i) >= mx*0.8) return i;
  return 0;
}
function parseSlot(slot, autoHeader){
  const ws = slot.wb.Sheets[slot.sheet];
  if (!slot.aoa){
    if (!ws || !ws['!ref']){ slot.aoa = []; slot.off = 0; }
    else{
      slot.off = XLSX.utils.decode_range(ws['!ref']).s.r;
      slot.aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:'', blankrows:true});
    }
  }
  if (autoHeader) slot.hr = slot.aoa.length ? detectHeader(slot.aoa) + slot.off + 1 : 1;
  $('#hr'+slot.id).value = slot.hr;
  const hi = slot.hr - slot.off - 1;
  const hrow = slot.aoa[hi];
  if (!hrow){ slot.headers = []; slot.rows = []; $('#meta'+slot.id).textContent = '標題列超出範圍'; return; }
  const seen = new Map();
  slot.headers = hrow.map((h,i) => {
    let n = cellStr(h).normalize('NFKC').trim() || ('欄'+(i+1));
    if (seen.has(n)){ const k = seen.get(n)+1; seen.set(n,k); n = n+'_'+k; } else seen.set(n,1);
    return n;
  });
  slot.rows = [];
  for (let i=hi+1;i<slot.aoa.length;i++){
    const r = slot.aoa[i];
    if (r.every(c => cellStr(c).trim() === '')) continue;
    const v = {};
    slot.headers.forEach((h,j) => v[h] = r[j] === undefined ? '' : r[j]);
    slot.rows.push({rn: i + slot.off + 1, v, idx: slot.rows.length});
  }
  $('#meta'+slot.id).textContent = `${slot.rows.length} 筆資料列、${slot.headers.length} 欄（標題列：${slot.headers.slice(0,6).join(' / ')}${slot.headers.length>6?' …':''}）`;
}

/* ================= 欄位設定 ================= */
function syncColumns(){
  const a = S.A.headers || [], b = S.B.headers || [];
  COLS = [...a, ...b.filter(x => !a.includes(x))];
}
/* 依欄位名稱找常見的識別欄位；找不到時用資料挑出「最能區分每一列」的欄位組合 */
const KEY_NAME_RE = [/^line\s*(no|number|#)?\.?$/i, /ident.?code|item.?code|part.?(no|number)|^item$|^sku$|^id$/i, /^size/i, /編號|料號|品號|代碼|代號/];
function suggestKey(){
  const named = COLS.filter(c => KEY_NAME_RE.some(re => re.test(c)));
  if (named.length) return named;
  const rows = S.B.rows, n = rows.length;
  const cand = COLS.filter(c => S.A.headers.includes(c) && S.B.headers.includes(c));
  let chosen = [], cur = rows.map(() => '');
  for (let step = 0; step < 4; step++){
    let best = null, bestD = -1;
    for (const c of cand){
      if (chosen.includes(c)) continue;
      const set = new Set();
      for (let i = 0; i < n; i++) set.add(cur[i] + '\u0001' + nval(rows[i], c));
      if (set.size > bestD){ bestD = set.size; best = c; }
    }
    if (!best) break;
    const before = new Set(cur).size;
    if (bestD <= before && chosen.length) break;
    chosen.push(best);
    cur = rows.map((r,i) => cur[i] + '\u0001' + nval(r, best));
    if (bestD >= n * 0.999) break;
  }
  return chosen.length ? chosen : (COLS.length ? [COLS[0]] : []);
}
const sampleCache = new Map();
function sampleOf(c){
  if (sampleCache.has(c)) return sampleCache.get(c);
  let v = '';
  for (const slot of [S.B, S.A]){
    for (let i = 0; i < Math.min(slot.rows.length, 500) && !v; i++) v = cellStr(slot.rows[i].v[c]).trim();
    if (v) break;
  }
  sampleCache.set(c, v); return v;
}
const sameSet = (x, y) => x.size === y.size && [...x].every(v => y.has(v));
function renderCfg(){
  $('#cfgCard').hidden = !(S.A.rows && S.B.rows);
  if ($('#cfgCard').hidden) return;
  const wrap = $('#cfgTable'), top = wrap.scrollTop;

  const list = COLS.filter(c => !q || normText(c).includes(q));
  const mini = k => `<span class="mini"><a data-act="all" data-k="${k}">全選</a><a data-act="none" data-k="${k}">清除</a></span>`;
  const rows = list.map(c => {
    const onlyA = !S.B.headers.includes(c), onlyB = !S.A.headers.includes(c);
    const key = draft.key.has(c);
    return `<tr class="${key?'iskey':''}" data-row="${esc(c)}">
      <td class="nm l">${esc(c)}${onlyA?'<span class="tag">僅 Rev A</span>':''}${onlyB?'<span class="tag">僅 Rev B</span>':''}</td>
      <td class="smp l" title="${esc(sampleOf(c))}">${esc(sampleOf(c))}</td>
      <td><input type="checkbox" data-k="key" data-c="${esc(c)}" ${key?'checked':''}></td>
      <td><input type="checkbox" data-k="cmp" data-c="${esc(c)}" ${!key&&draft.cmp.has(c)?'checked':''} ${key?'disabled':''}></td>
      <td><input type="checkbox" data-k="qty" data-c="${esc(c)}" ${draft.qty.has(c)?'checked':''}></td></tr>`;
  }).join('');
  wrap.innerHTML = `<table class="cfgt"><thead><tr><th class="l">欄位</th><th class="l">範例值</th>
    <th>Key${mini('key')}</th><th>比對${mini('cmp')}</th><th>數量${mini('qty')}</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="5" class="ph">沒有符合的欄位</td></tr>'}</tbody></table>`;
  wrap.scrollTop = top;
  updateCfgStatus();
}
/* 只更新狀態列與「尚未套用」提示，不重畫表格（保留捲動位置） */
function updateCfgStatus(){

    (ks.length && !nc ? '<br><span style="color:var(--mod-t)">⚠ 尚未勾選任何比對欄位，只會判斷新增 / 刪除，不會偵測修改</span>' : '');

  const miss = [...keyCols.filter(c => !S.A.headers.includes(c)).map(c => `<code>${esc(c)}</code>（Rev A 沒有）`),
                ...keyCols.filter(c => !S.B.headers.includes(c)).map(c => `<code>${esc(c)}</code>（Rev B 沒有）`)];
  if (miss.length){ showMsg(`Key 欄位 ${miss.join('、')}，請調整 Key 或標題列。`, true); return; }

/* ================= 比對核心 ================= */
/* 每個儲存格只正規化一次（NFKC 很耗時），之後都用快取 */
function nval(r, c){ const m = r.nc || (r.nc = {}); return c in m ? m[c] : (m[c] = norm(r.v[c])); }
function rowKey(row, keyCols){ return keyCols.map(c => nval(row, c)).join('\u0001'); }
function keyLabel(row, keyCols){ return keyCols.map(c => cellStr(row.v[c]).trim()).join(' | '); }

function diffRows(a, b, cols){
  const out = [];
  for (const c of cols){
    if (nval(a, c) !== nval(b, c)) out.push(c);
  }
  return out;
}
const GREEDY_LIMIT = 40000;   // 剩餘 A×B 超過這個數量就不做「差異最少」配對，避免爆炸
function pairGroup(as, bs, cols, stat){
  // 回傳 [[a,b],...]；同 Key 多筆時：
  // 1) 內容完全相同的先配對（雜湊，O(n)）
  // 2) 剩下的在數量不大時依「差異最少」配對，太大時改依原順序配對
  if (as.length === 1 && bs.length === 1) return [[as[0], bs[0]]];
  const sig = r => cols.map(c => nval(r, c)).join('\u0002');
  const idxB = new Map();
  bs.forEach((b, j) => { const k = sig(b); const l = idxB.get(k); l ? l.push(j) : idxB.set(k, [j]); });
  const pairs = [], usedB = new Set(), remA = [];
  for (const a of as){
    const l = idxB.get(sig(a));
    if (l && l.length){ const j = l.shift(); usedB.add(j); pairs.push([a, bs[j]]); } else remA.push(a);
  }
  const remB = bs.filter((_, j) => !usedB.has(j));
  if (!remA.length || !remB.length) return pairs;
  if (remA.length * remB.length <= GREEDY_LIMIT){
    const cand = [];
    remA.forEach((a,i) => remB.forEach((b,j) => cand.push({d:diffRows(a,b,cols).length, gap:Math.abs(i-j), i, j})));
    cand.sort((x,y) => x.d-y.d || x.gap-y.gap || x.i-y.i || x.j-y.j);
    const ua = new Set(), ub = new Set();
    for (const c of cand){
      if (ua.has(c.i) || ub.has(c.j)) continue;
      ua.add(c.i); ub.add(c.j); pairs.push([remA[c.i], remB[c.j]]);
    }
  } else {
    if (stat) stat.byOrder += Math.min(remA.length, remB.length);
    for (let i = 0; i < Math.min(remA.length, remB.length); i++) pairs.push([remA[i], remB[i]]);
  }
  return pairs;
}
function groupBy(rows, keyCols){
  const m = new Map();
  for (const r of rows){
    const k = rowKey(r, keyCols);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  return m;
}
function compare(A, B, keyCols, cmpCols, qtyCols){
  const pstat = {byOrder:0};
  const gA = groupBy(A.rows, keyCols), gB = groupBy(B.rows, keyCols);
  const dups = {A:[], B:[]};
  for (const [side, g, rows] of [['A',gA],['B',gB]]){
    for (const [k, rs] of g) if (rs.length > 1)
      dups[side].push({key: keyLabel(rs[0], keyCols) || '（Key 全空）', count: rs.length, rns: rs.map(r => r.rn)});
  }
  const mainEntries = [], aMatch = new Map(), delEntries = [];
  const mk = (a, b) => {
    const e = {a, b, changes: [], status: ''};
    if (a && b){
      e.changes = diffRows(a, b, cmpCols).map(c => {
        const ch = {col:c, oldV:cellStr(a.v[c]), newV:cellStr(b.v[c]), delta:null};
        if (qtyCols.has(c)){
          const x = parseNum(a.v[c]), y = parseNum(b.v[c]);
          if (x !== null && y !== null) ch.delta = y - x;
        }
        return ch;
      });
      e.status = e.changes.length ? 'mod' : 'same';
    } else e.status = b ? 'add' : 'del';
    return e;
  };
  // 以 B 的順序輸出；同 Key 多筆時一次處理整組
  const doneKeys = new Set();
  const pairedB = new Map();   // B row -> entry
  for (const [k, bs] of gB){
    const as = gA.get(k) || [];
    const pairs = pairGroup(as, bs, cmpCols, pstat);
    const usedA = new Set(), usedB = new Set();
    for (const [a,b] of pairs){ const e = mk(a,b); pairedB.set(b, e); aMatch.set(a, e); usedA.add(a); usedB.add(b); }
    for (const b of bs) if (!usedB.has(b)) pairedB.set(b, mk(null,b));
    for (const a of as) if (!usedA.has(a)) delEntries.push(mk(a,null));
    doneKeys.add(k);
  }
  for (const [k, as] of gA) if (!doneKeys.has(k)) for (const a of as) delEntries.push(mk(a,null));
  for (const b of B.rows) mainEntries.push(pairedB.get(b));
  // 刪除列：插在 A 中「前一個有對應到的列」之後；找不到則放最前
  const anchor = new Map(); // entry|null -> [dels]
  const aIndex = new Map(A.rows.map((r,i) => [r,i]));
  for (const d of delEntries.sort((x,y) => x.a.idx - y.a.idx)){
    let i = aIndex.get(d.a) - 1, tgt = null;
    for (; i >= 0; i--){ const m = aMatch.get(A.rows[i]); if (m){ tgt = m; break; } }
    if (!anchor.has(tgt)) anchor.set(tgt, []);
    anchor.get(tgt).push(d);
  }
  const entries = [...(anchor.get(null) || [])];
  for (const e of mainEntries){ entries.push(e); if (anchor.has(e)) entries.push(...anchor.get(e)); }
  const counts = {add:0, del:0, mod:0, same:0};
  const colCount = {};
  for (const e of entries){
    counts[e.status]++;
    e.hay = [e.status, ...Object.values((e.b||e.a).v).map(normText), ...(e.a ? Object.values(e.a.v).map(normText) : [])].join('\u0001');
    e.hay += '\u0001' + ({add:'新增',del:'刪除',mod:'修改',same:'未變'})[e.status];
    for (const c of e.changes) colCount[c.col] = (colCount[c.col]||0) + 1;
  }
  for (const side of ['A','B']) dups[side].sort((x,y) => y.count - x.count);
  return {entries, counts, colCount, dups, byOrder:pstat.byOrder};
}

function runCompare(){
  const keyCols = COLS.filter(c => applied.key.has(c));
  const cmpCols = COLS.filter(c => !applied.key.has(c) && applied.cmp.has(c));
  R = compare(S.A, S.B, keyCols, cmpCols, applied.qty);
  R.keyCols = keyCols; R.cmpCols = cmpCols;
  $('#sumCard').hidden = $('#resCard').hidden = false;
  statusOn = new Set(['add','del','mod','same']); pageSize = 500;
  renderSummary(); renderWarnings(); renderTable();
}

/* ================= 顯示 ================= */
const LABEL = {add:'新增', del:'刪除', mod:'修改', same:'未變'};
function renderSummary(){
  const c = R.counts;
  $('#stats').innerHTML = `
    <div class="stat add"><span class="lb">新增</span><div class="n">${c.add}</div></div>
    <div class="stat del"><span class="lb">刪除</span><div class="n">${c.del}</div></div>
    <div class="stat mod"><span class="lb">修改</span><div class="n">${c.mod}</div></div>
    <div class="stat same"><span class="lb">未變</span><div class="n">${c.same}</div></div>
    <div class="stat"><span class="lb">總列數</span><div class="n">${R.entries.length}</div></div>`;
  const cc = Object.entries(R.colCount).sort((a,b) => b[1]-a[1]);
  $('#colStat').innerHTML = cc.length
    ? '修改欄位統計：' + cc.map(([k,v]) => `<b>${esc(k)}</b> ×${v}`).join('　')
    : '沒有任何欄位被修改。';
}
function renderWarnings(){
  const w = [];
  for (const side of ['A','B']){
    const d = R.dups[side];
    if (!d.length) continue;
    const rows = d.reduce((s,x) => s + x.count, 0);
    w.push(`<details class="warn"><summary>⚠ ${S[side].label} 有 ${d.length} 組重複 Key（共 ${rows} 列）<span style="font-weight:400">　點擊展開明細</span></summary>
      <div>同一檔案內 Key 相同的列不會被略過：會與另一檔的同 Key 列依「差異最少」優先一對一配對，多出來的列計為新增 / 刪除。建議把更多欄位勾進 Key 以降低重複。</div>
      <ul>${d.slice(0,200).map(x => `<li><code>${esc(x.key)}</code> × ${x.count}　（Excel 列 ${x.rns.slice(0,12).join(', ')}${x.rns.length>12?' …共 '+x.rns.length+' 列':''}）</li>`).join('')}${d.length>200?`<li>…另有 ${d.length-200} 組</li>`:''}</ul></details>`);
  }
  const tot = {A:S.A.rows.length, B:S.B.rows.length};
  const low = ['A','B'].filter(side => tot[side] && R.dups[side].reduce((n,x) => n + x.count, 0) / tot[side] > 0.2);
  if (low.length || R.byOrder)
    w.unshift(`<details class="warn err"><summary>⚠ 目前的 Key 區分度太低，比對結果不可靠<span style="font-weight:400">　點擊展開說明</span></summary>
      <div>${low.map(x => S[x].label).join('、') || '部分資料'}有大量列的 Key 相同。${R.byOrder ? `其中 <b>${R.byOrder}</b> 列因同 Key 數量過多，只能依出現順序配對，修改與新增 / 刪除的判斷可能不準。` : ''}
      請在上方「比對設定」多勾選幾個能唯一識別一列的 Key 欄位（例如編號、代碼、尺寸、序號等），再按「套用並開始比對」。</div></details>`);
  const onlyA = S.A.headers.filter(c => !S.B.headers.includes(c)), onlyB = S.B.headers.filter(c => !S.A.headers.includes(c));
  if (onlyA.length || onlyB.length)
    w.push(`<details class="warn"><summary>⚠ 兩檔欄位不完全相同<span style="font-weight:400">　點擊展開明細</span></summary>
      ${onlyA.length?`<div>只在 Rev A：${onlyA.map(c=>'<code>'+esc(c)+'</code>').join(' ')}</div>`:''}
      ${onlyB.length?`<div>只在 Rev B：${onlyB.map(c=>'<code>'+esc(c)+'</code>').join(' ')}</div>`:''}
      <div>缺少的一側視為空值比對。</div></details>`);
  $('#warns').innerHTML = w.join('');
}
function renderFilterChips(){
  const c = R.counts;
  $('#fchips').innerHTML =
    [['all','全部',R.entries.length],['add','新增',c.add],['del','刪除',c.del],['mod','修改',c.mod],['same','未變',c.same]]
    .map(([k,n,v]) => {
      const on = k === 'all' ? statusOn.size === 4 : statusOn.has(k);
      return `<button class="fchip ${k} ${on?'on':''}" data-s="${k}">${n} ${v}</button>`;
    }).join('');
}
$('#fchips').addEventListener('click', e => {
  const s = e.target.dataset && e.target.dataset.s; if (!s) return;
  if (s === 'all') statusOn = new Set(['add','del','mod','same']);
  else if (statusOn.size === 4) statusOn = new Set([s]);
  else { statusOn.has(s) ? statusOn.delete(s) : statusOn.add(s); if (!statusOn.size) statusOn = new Set(['add','del','mod','same']); }
  pageSize = 500; renderTable();
});
$('#q').addEventListener('input', () => { pageSize = 500; renderTable(); });

function filteredEntries(){
  const terms = normText($('#q').value).split(' ').filter(Boolean);
  return R.entries.filter(e => statusOn.has(e.status) && terms.every(t => e.hay.includes(t)));
}
function computeVisCols(list){
  let cols = COLS.slice();
  if ($('#optHideEmpty').checked)
    cols = cols.filter(c => R.entries.some(e => (e.a && cellStr(e.a.v[c]).trim()) || (e.b && cellStr(e.b.v[c]).trim())));
  if ($('#optOnlyDiff').checked)
    cols = cols.filter(c => R.keyCols.includes(c) || R.colCount[c]);
  return cols;
}
function cellHTML(e, c){
  const ch = e.changes.find(x => x.col === c);
  const val = (e.b || e.a).v[c];
  if (!ch) return `<td>${esc(cellStr(val))}</td>`;
  const emp = '<span class="empty">空</span>';
  const o = ch.oldV.trim() === '' ? emp : esc(ch.oldV), n = ch.newV.trim() === '' ? emp : esc(ch.newV);
  return `<td class="chg" title="舊：${esc(ch.oldV)} → 新：${esc(ch.newV)}"><span class="o">${o}</span><span class="arrow">→</span><span class="nv">${n}</span>${ch.delta !== null ? `<span class="dl">${fmtDelta(ch.delta)}</span>` : ''}</td>`;
}
function renderTable(){
  if (!R) return;
  renderFilterChips();
  shown = filteredEntries();
  visCols = computeVisCols(shown);
  $('#cnt').textContent = `顯示 ${shown.length} / ${R.entries.length} 列`;
  $('#btnExport').disabled = !R.entries.length;
  const head = `<tr><th class="cat">類別</th><th>差異欄位</th><th>A 列</th><th>B 列</th>${visCols.map(c => `<th class="${R.keyCols.includes(c)?'key':''}">${esc(c)}</th>`).join('')}</tr>`;
  const part = shown.slice(0, pageSize);
  const body = part.map(e => `<tr class="${e.status}"><td class="cat">${LABEL[e.status]}</td>
    <td>${esc(e.changes.map(x=>x.col).join(', '))}</td><td class="rn">${e.a?e.a.rn:''}</td><td class="rn">${e.b?e.b.rn:''}</td>
    ${visCols.map(c => cellHTML(e,c)).join('')}</tr>`).join('');
  $('#tw').innerHTML = shown.length
    ? `<table><thead>${head}</thead><tbody>${body}</tbody></table>` +
      (shown.length > pageSize ? `<div class="more"><button class="fchip" id="btnMore">再載入 500 列（尚有 ${shown.length-pageSize} 列）</button></div>` : '')
    : '<div class="ph">沒有符合條件的列</div>';
  const m = $('#btnMore'); if (m) m.onclick = () => { pageSize += 500; renderTable(); };
}

/* ================= 匯出 .xlsx（自製寫檔，可帶顏色） ================= */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc = new TextEncoder(), chunks = [], central = [];
  let off = 0;
  for (const f of files){
    const nm = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x0021,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer), nm, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x0021,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nm.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const csize = central.reduce((s,x) => s + x.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,csize,true); end.setUint32(16,off,true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const colLetter = i => { let s='',n=i+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
const xesc = s => String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* 樣式索引：0 一般 1 標題 2 綠 3 紅 4 黃 5 粗體 */
function sheetXml(sh){
  const rows = sh.rows, ncol = Math.max(1, ...rows.map(r => r.length));
  const widths = Array.from({length:ncol}, (_,c) => {
    let w = 6;
    for (const r of rows.slice(0,400)){ const x = r[c]; const t = x == null ? '' : String(typeof x === 'object' ? x.v : x);
      let l = 0; for (const ch of t) l += ch.charCodeAt(0) > 255 ? 2 : 1; w = Math.max(w, l+2); }
    return Math.min(w, 48);
  });
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">' +
    (sh.freeze ? `<pane xSplit="${sh.freeze[0]}" ySplit="${sh.freeze[1]}" topLeftCell="${colLetter(sh.freeze[0])}${sh.freeze[1]+1}" activePane="bottomRight" state="frozen"/>` : '') +
    '</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>' +
    widths.map((w,i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + '</cols><sheetData>';
  rows.forEach((r, ri) => {
    x += `<row r="${ri+1}">`;
    r.forEach((c, ci) => {
      if (c == null || c === '') return;
      const v = typeof c === 'object' ? c.v : c, s = typeof c === 'object' ? (c.s||0) : 0;
      const ref = colLetter(ci) + (ri+1);
      x += typeof v === 'number' && isFinite(v)
        ? `<c r="${ref}" s="${s}"><v>${v}</v></c>`
        : `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
    });
    x += '</row>';
  });
  x += '</sheetData>' + (sh.filter && rows.length > 1 ? `<autoFilter ref="A1:${colLetter(ncol-1)}${rows.length}"/>` : '') + '</worksheet>';
  return x;
}
function buildXlsx(sheets){
  const fills = ['FFC6EFCE','FFFFC7CE','FFFFEB9C','FF305496'];
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fills.map(c => `<fill><patternFill patternType="solid"><fgColor rgb="${c}"/><bgColor indexed="64"/></patternFill></fill>`).join('')}</fills>
<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="6">
<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>
<xf numFmtId="0" fontId="1" fillId="5" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1"/>
<xf numFmtId="0" fontId="0" fillId="2" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>
<xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>
<xf numFmtId="0" fontId="0" fillId="4" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>
<xf numFmtId="0" fontId="2" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1"/>
</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const NS = 'http://schemas.openxmlformats.org/';
  const files = [

    {name:'_rels/.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${NS}officeDocument/2006/relationships"><sheets>${sheets.map((s,i) => `<sheet name="${xesc(s.name.replace(/[\\\/?*\[\]:]/g,'_').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}package/2006/relationships">${sheets.map((_,i) => `<Relationship Id="rId${i+1}" Type="${NS}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${NS}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml', data:styles},
    ...sheets.map((s,i) => ({name:`xl/worksheets/sheet${i+1}.xml`, data:sheetXml(s)})),

const STY = {plain:0, head:1, add:2, del:3, mod:4, bold:5};
function exportXlsx(){
  if (!R) return;
  const list = $('#expFiltered').checked ? shown : R.entries;
  const cols = visCols.length ? visCols : COLS;
  const hdr = ['類別','差異欄位','A 列','B 列', ...cols].map(v => ({v, s:STY.head}));
  const rows = [hdr];
  for (const e of list){
    const base = e.status === 'add' ? STY.add : e.status === 'del' ? STY.del : STY.plain;
    const line = [{v:LABEL[e.status], s: e.status === 'mod' ? STY.mod : base},
      {v:e.changes.map(c => c.col).join(', '), s:base},
      {v:e.a ? e.a.rn : '', s:base}, {v:e.b ? e.b.rn : '', s:base}];
    for (const c of cols){
      const ch = e.changes.find(x => x.col === c);
      if (ch) line.push({v:`${ch.oldV.trim()===''?'(空)':ch.oldV} → ${ch.newV.trim()===''?'(空)':ch.newV}${ch.delta!==null?' ('+fmtDelta(ch.delta)+')':''}`, s:STY.mod});
      else{
        const raw = (e.b || e.a).v[c];
        line.push({v: raw instanceof Date ? cellStr(raw) : (raw == null ? '' : raw), s:base});
      }
    }
    rows.push(line);
  }
  const c = R.counts;
  const sum = [
    [{v:'項目',s:STY.head},{v:'內容',s:STY.head}],
    [{v:'Rev A（舊版）',s:STY.bold}, `${S.A.name}　[${S.A.sheet}]　標題列第 ${S.A.hr} 列　${S.A.rows.length} 筆`],
    [{v:'Rev B（新版）',s:STY.bold}, `${S.B.name}　[${S.B.sheet}]　標題列第 ${S.B.hr} 列　${S.B.rows.length} 筆`],
    [{v:'Key 欄位',s:STY.bold}, R.keyCols.join(' + ')],
    [{v:'新增',s:STY.add}, c.add], [{v:'刪除',s:STY.del}, c.del], [{v:'修改',s:STY.mod}, c.mod], [{v:'未變',s:STY.bold}, c.same],
    [{v:'匯出範圍',s:STY.bold}, $('#expFiltered').checked ? `目前篩選結果（${list.length} 列）` : `全部（${list.length} 列）`],
    [],[{v:'修改欄位統計',s:STY.head},{v:'次數',s:STY.head}],
    ...Object.entries(R.colCount).sort((a,b) => b[1]-a[1]).map(([k,v]) => [k, v]),
    [],[{v:'重複 Key 警告',s:STY.head},{v:'來源 / 數量 / Excel 列',s:STY.head}],
    ...['A','B'].flatMap(side => R.dups[side].map(d => [d.key, `Rev ${side} × ${d.count}（列 ${d.rns.join(', ')}）`])),
  ];
  if (!R.dups.A.length && !R.dups.B.length) sum.push(['（無）','']);
  const blob = buildXlsx([
    {name:'比對結果', rows, freeze:[1,1], filter:true},
    {name:'摘要', rows:sum},
  ]);
  const d = new Date(), p = n => String(n).padStart(2,'0');
  const fn = `compare_result_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.xlsx`;
  if (navigator.msSaveBlob){ navigator.msSaveBlob(blob, fn); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fn;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 4000);
}
$('#btnExport').addEventListener('click', exportXlsx);
